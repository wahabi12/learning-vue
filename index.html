<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=-, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
    <style>
        /* .box {
            padding: 100px 0;
            width: 400px;
            text-align: center;
            background: #ddd;
            margin: 20px;
            display: inline-block;
        } */

        body {
             background: #eee;
             max-width: 960px;
             margin: 20px auto;
        }

        p, h2, ul {
            margin: 0;
            padding: 0;
        }

        li {
            list-style-type: none;
            background: #fff;
            margin: 20px auto;
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        li.fav {
            background: rgb(173, 144, 173);
            color: #fff;
        }
    </style>

</head>
<body>
    <div id="app">
        <!-- <a :href="url">best</a> -->
        <div v-if="showBooks">
            <ul>
                <li v-for="book in books" :class="{fav: book.isFav }" @click='toggleFav(book)'>
                    <img :src="book.img" :alt="book.title">
                    <h2> {{ book.title }}</h2>
                    <p> {{ book.author }} </p>
                </li>
            </ul>
        </div>
        
        <button @click="toggleShowBooks">
            <span v-if="showBooks">hide</span>
            <span v-else>show</span>
        </button>

        <br>

        <!-- <div class="box" @mouseover="handleEvent">mouseover</div>
        <div class="box" @mouseleave="handleEvent">mouseleave</div>
        <div class="box" @dblclick="handleEvent">double click</div>
        <div class="box" @mousemove="handleMousemove"> {{ x }} - {{ y }} </div> -->
    </div>

<script src="app.js"></script>
</body>
</html>
